<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img"
     aria-label="James Collard, Solutions Engineer in London. Salesforce, TypeScript and Rust.">
  <!-- Static header. Colours follow the viewer's light/dark preference via the media query below. -->
  <style>
    .bg    { fill: #0d0c0b; }
    .edge  { stroke: #2a2724; }
    .rule  { stroke: #3a3632; }
    .name  { fill: #f3efe9; font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
    .role  { fill: #e8a33d; font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; font-style: italic; }
    .meta  { fill: #8b8681; font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    @media (prefers-color-scheme: light) {
      .bg   { fill: #f7f4ef; }
      .edge { stroke: #ddd6cc; }
      .rule { stroke: #cfc7bc; }
      .name { fill: #1a1816; }
      .role { fill: #96590c; }
      .meta { fill: #6b655e; }
    }
  </style>
  <rect class="bg" width="1000" height="260" rx="6"/>
  <rect class="edge" x="0.5" y="0.5" width="999" height="259" rx="6" fill="none"/>
  <text class="name" x="46" y="112" font-size="80" letter-spacing="-1.5">James Collard</text>
  <text class="role" x="48" y="168" font-size="40">Solutions Engineer</text>
  <line class="rule" x1="48" y1="198" x2="952" y2="198"/>
  <g class="meta" font-size="20" letter-spacing="2">
    <text x="48" y="234">LONDON, UK</text>
    <text x="952" y="234" text-anchor="end">SALESFORCE &#183; TYPESCRIPT &#183; RUST</text>
  </g>
</svg>
